<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>contact us</title>
	<style type="text/css">
		@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200&display=swap');
		@import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,900;1,100;1,300;1,900&family=Quicksand:wght@300;400;700&family=Roboto+Slab:wght@700&display=swap');


		*{
			margin:0;
			padding:0;
			box-sizing: border-box;
			font-family: 'quicksand',sans-serif;
			text-decoration: none;
			text-align:center;

			
		}
		main{
			min-height:100vh;
			background: linear-gradient(to right top,#123456,grey);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;

		}
		h1{
			font-size:77px;
			color:#123456;
			padding-bottom:30px;
		}
		h1 span{
			font-size:60px;
		}
		p{
			padding-bottom:30px;
		}
		a{
			color:#123456;
			font-weight: bold;
		}
		.glass{
			background : white;
			min-height: 75vh;
			width:90%;
			background: linear-gradient(to right bottom ,rgba(255,255,255,0.7),rgba(255,255,255,0.3));
			border-radius: 25px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}
		button{
			padding:12px;
			margin:20px;
			background:#fff;
			border:none;
			border-radius: 10px;
		}
		button:hover{
			transform: scale(1.3);
			transition: .5s ease;
		}
		a{
			font-weight: 900;
		}
		.mail{
			padding:7px;
			margin:10px;
			background:#fff;
			border-radius: 10px

		}
		iframe{
			padding:20px 0;
			width:650px;
			height:280px;
			border-radius: 50px;
			}
			h3{
				color:#123456;
				font-size:25px;
				font-weight: bold;
			}
		@media screen and (max-width: 768px){
			.glass{
				min-height:60vh;
				width:80%;
			}
		h1{
			font-size:55px;
			color:#123456;
			padding-bottom:10px;
		}
		h1 span{
			font-size:35px;
		}
		p{
			padding-bottom:30px;
		}
		a{
			color:#123456;
			font-weight: bold;
		}
				iframe{
			padding:20px 0;
			width:250px;
			height:280px;
			border-radius: 50px;
			}

		}

	</style>
</head>
<body>
	<main>
	<section class="glass">
		<h1>Hind<br><span>shipping & logistics</span></h1>

		<p> You can call us via clicking the call button in the below<br>
			You can also mail us
		</p>
		<div class="btn">
		<button><a href="tel:+918390022000">CALL US</a></button>
		<button><a href="mailto:info@hindshipping.in" class="mail">GMAIL</a></button>
		</div>
		
		<div class="location">
		<h3>LOCATION</h3>
		<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3671.598383170414!2d72.5658811144425!3d23.038513921514507!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e852f0b9dc237%3A0xbc7d253222465b85!2sLoha%20bhavan!5e0!3m2!1sen!2sin!4v1674892267181!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
		</div>

</main>

</html>
